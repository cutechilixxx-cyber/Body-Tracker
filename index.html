<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vitality OS | Ultra</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    
    <style>
        :root {
            --bg: #0b1120; --card-bg: #1e293b; --accent: #38bdf8; --text: #f8fafc;
            --text-dim: #94a3b8; --border: #334155; --input-bg: #0f172a; --success: #10b981; --danger: #ef4444;
            --warning: #f59e0b; --overdose: #a78bfa;
        }
        .light-theme {
            --bg: #f1f5f9; --card-bg: #ffffff; --accent: #0ea5e9; --text: #0f172a;
            --text-dim: #64748b; --border: #e2e8f0; --input-bg: #f8fafc;
        }
        * { box-sizing: border-box; transition: all 0.2s ease; font-family: -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }

        #main-app { width: 100%; max-width: 480px; padding: 20px; padding-top: 40px; padding-bottom: 120px; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; }
        
        .streak-badge {
            display: flex; gap: 15px; align-items: center; justify-content: space-between;
            background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 16px; padding: 10px 15px; margin-top: 12px; width: 100%;
        }
        .xp-section { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .streak-text { font-weight: 800; font-size: 0.85rem; white-space: nowrap; }
        .xp-text { font-size: 0.75rem; font-weight: 900; color: var(--text-dim); text-align: right; }

        .btn-tool { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; min-width: 40px; min-height: 40px; }
        .btn-del { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); }

        .glass-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 32px; padding: 25px; margin-bottom: 25px; position: relative;}
        textarea { width: 100%; padding: 16px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 18px; outline: none; margin-top: 15px; resize: none; font-size: 1rem; }
        .btn-main { background: var(--accent); color: #fff; border: none; padding: 16px; border-radius: 18px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 15px; font-size: 1rem; }

        .n-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 28px; padding: 20px; margin-bottom: 15px; }
        .n-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .controls { display: flex; align-items: center; gap: 10px; }
        .btn-inc { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        .p-bar-bg { height: 10px; background: var(--input-bg); border-radius: 20px; overflow: hidden; margin-bottom: 10px; }
        .p-bar-fill { height: 100%; border-radius: 20px; transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        .overdose-anim { animation: pulse-warn 1.5s infinite; }
        @keyframes pulse-warn { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .week-chart { display: flex; justify-content: space-between; align-items: flex-end; height: 35px; margin-top: 10px; padding-top: 5px; border-top: 1px solid var(--border); }
        .day-column { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .day-bar { width: 8px; border-radius: 2px; min-height: 2px; transition: height 1s ease; }

        .history-item { display: flex; flex-direction: column; background: var(--card-bg); padding: 15px 20px; border-radius: 22px; margin-bottom: 10px; border: 1px solid var(--border); }
        .save-container { position: fixed; bottom: 25px; left: 0; right: 0; display: flex; justify-content: center; z-index: 100; gap: 10px; }
        .btn-save { background: var(--success); color: white; padding: 16px 30px; border-radius: 50px; font-weight: 900; border: none; cursor: pointer; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; display: none; align-items: flex-end; backdrop-filter: blur(8px); }
        .modal-content { width: 100%; max-width: 480px; background: var(--bg); border-radius: 32px 32px 0 0; padding: 30px; margin: 0 auto; max-height: 90vh; overflow-y: auto; border-top: 2px solid var(--accent); }
        
        .product-item { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 16px; border-radius: 20px; margin-bottom: 12px; border: 1px solid var(--border); cursor: pointer;}
        .bio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .bio-input { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 14px; width: 100%; outline: none; font-size: 1rem; }
        
        .scan-area { border: 2px dashed var(--border); border-radius: 24px; padding: 40px; text-align: center; margin-top: 20px; cursor: pointer; }
        #ocr-status { font-size: 0.85rem; color: var(--accent); margin-top: 15px; text-align: center; min-height: 20px; }

        .level-container { width: 100%; height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; }
        #level-progress { height: 100%; background: var(--success); width: 0%; border-radius: 10px; }

        #ai-advice-box { 
            background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent); 
            padding: 15px; border-radius: 20px; margin-top: 15px; display: none;
            font-size: 0.9rem; line-height: 1.4; color: var(--accent);
        }
    </style>
</head>
<body onload="initApp()">

    <div id="bio-modal" class="modal-overlay" onclick="closeModal('bio-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 style="margin:0;">🧬 БИО-ПРОФИЛЬ</h2>
                <button class="btn-tool" onclick="closeModal('bio-modal')">✕</button>
            </div>
            <div class="bio-grid">
                <div>
                    <label style="font-size:0.75rem; font-weight:bold; display:block; margin-bottom:8px; color:var(--accent);">ВЕС (КГ)</label>
                    <input type="number" id="bio-weight" class="bio-input" placeholder="70" onchange="updateBio()">
                </div>
                <div>
                    <label style="font-size:0.75rem; font-weight:bold; display:block; margin-bottom:8px; color:var(--accent);">АКТИВНОСТЬ</label>
                    <select id="bio-act" class="bio-input" onchange="updateBio()">
                        <option value="1">Низкая</option>
                        <option value="1.2" selected>Средняя</option>
                        <option value="1.5">Высокая</option>
                    </select>
                </div>
            </div>
            <button class="btn-main" onclick="closeModal('bio-modal')">СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
        </div>
    </div>

    <div id="scan-modal" class="modal-overlay" onclick="closeModal('scan-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 style="margin:0;">📷 СКАНЕР СОСТАВА</h2>
                <button class="btn-tool" onclick="closeModal('scan-modal')">✕</button>
            </div>
            <div class="scan-area" onclick="triggerOCR()">
                <div style="font-size: 3rem; margin-bottom: 10px;">📸</div>
                <div style="font-weight: bold;">Нажмите, чтобы сделать фото</div>
            </div>
            <div id="ocr-status"></div>
            <input type="file" id="ocr-upload" hidden accept="image/*" onchange="processOCR(event)">
        </div>
    </div>

    <div id="catalog-panel" class="modal-overlay" onclick="closeModal('catalog-panel')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="margin:0;">🍽️ КАТАЛОГ</h2>
                <button class="btn-tool" onclick="closeModal('catalog-panel')">✕</button>
            </div>
            <div id="product-list-container"></div>
        </div>
    </div>

    <div id="main-app">
        <div class="header">
            <div style="flex-grow: 1; max-width: 65%;">
                <span id="dynamic-greet" style="color:var(--text-dim); font-size: 0.8rem;">Добрый день,</span>
                <h2 style="margin:0;">Vitality User! 🧬</h2>
                
                <div class="streak-badge">
                    <span class="streak-text" id="streak-text">🔥 3 ДНЯ СЕРИЯ</span>
                    <div class="xp-section">
                        <span class="xp-text" id="xp-display">XP: 0</span>
                        <div class="level-container"><div id="level-progress"></div></div>
                    </div>
                </div>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                <button class="btn-tool" id="lang-btn" onclick="toggleLanguage()">EN</button>
                <button class="btn-tool" onclick="openModal('bio-modal')">⚙️</button>
                <button class="btn-tool" onclick="toggleTheme()">☀️</button>
                <button class="btn-tool" onclick="exportPDF()">📄</button>
                <button class="btn-tool btn-del" onclick="clearAllData()">🗑️</button>
            </div>
        </div>

        <div class="glass-panel">
            <textarea id="smart-input" placeholder="Введите продукт (например: Курица, Яйца)..." rows="2"></textarea>
            <div style="display:grid; grid-template-columns: 1.5fr 1fr 1fr; gap:10px; margin-top: 15px;">
                <button class="btn-main" style="margin-top:0;" onclick="smartAnalyze()">АНАЛИЗ</button>
                <button class="btn-main" style="margin-top:0; background: var(--card-bg); border: 1px solid var(--accent); color: var(--accent);" onclick="openModal('scan-modal')">📷</button>
                <button class="btn-main" style="margin-top:0; background: var(--card-bg); border: 1px solid var(--border); color: var(--text);" onclick="openModal('catalog-panel')">＋</button>
            </div>
            <button class="btn-main" style="background: rgba(167, 139, 250, 0.1); color: #a78bfa; border: 1px solid #a78bfa; margin-top: 10px; padding: 10px;" onclick="getAISuggestion()">✨ AI СОВЕТ</button>
            <div id="ai-advice-box"></div>
        </div>

        <div id="nutrient-list"></div>

        <div style="margin-top: 30px;">
            <h3 style="color: var(--text-dim); font-size: 0.9rem; margin-bottom: 15px;">НЕДАВНЯЯ АКТИВНОСТЬ</h3>
            <div id="history-list"></div>
        </div>

        <div class="save-container">
            <button class="btn-save" onclick="syncAndReset()">💾 СИНХРОНИЗАЦИЯ</button>
        </div>
    </div>

<script>
    let history = [];
    let userXP = 0;
    let weightMult = 1.0;
    let activityMult = 1.2;
    let currentLang = 'RU';
    
    const products = [
        { name: "Яйцо", icon: "🥚", nutrients: { vitD3: 40, vitB12: 0.5, vitA: 80, calcium: 30 } },
        { name: "Лосось (100г)", icon: "🐟", nutrients: { omega: 1500, vitD3: 400, vitB12: 4, potassium: 350 } },
        { name: "Шпинат (100г)", icon: "🌿", nutrients: { iron: 2.7, vitA: 450, mag: 80, vitC: 28 } },
        { name: "Миндаль (30г)", icon: "🥜", nutrients: { vitE: 7, mag: 80, calcium: 75, zinc: 1 } },
        { name: "Говядина (100г)", icon: "🥩", nutrients: { iron: 3, zinc: 5, vitB12: 2.5, potassium: 300 } }
    ];

    let nutrients = [
        { key: 'iron', id: 'Железо', emoji: '🥩', cur: 0, norm: 18, color: '#f87171', weekly: [0,0,0,0,0,0,0] },
        { key: 'mag', id: 'Магний', emoji: '🌿', cur: 0, norm: 400, color: '#34d399', weekly: [0,0,0,0,0,0,0] },
        { key: 'vitC', id: 'Витамин C', emoji: '🍊', cur: 0, norm: 90, color: '#38bdf8', weekly: [0,0,0,0,0,0,0] },
        { key: 'vitB12', id: 'Витамин B12', emoji: '🧬', cur: 0, norm: 2.4, color: '#a78bfa', weekly: [0,0,0,0,0,0,0] },
        { key: 'vitD3', id: 'Витамин D3', emoji: '☀️', cur: 0, norm: 600, color: '#fbbf24', weekly: [0,0,0,0,0,0,0] },
        { key: 'zinc', id: 'Цинк', emoji: '🐚', cur: 0, norm: 11, color: '#94a3b8', weekly: [0,0,0,0,0,0,0] },
        { key: 'calcium', id: 'Кальций', emoji: '🥛', cur: 0, norm: 1000, color: '#e2e8f0', weekly: [0,0,0,0,0,0,0] },
        { key: 'omega', id: 'Омега-3', emoji: '🐟', cur: 0, norm: 1000, color: '#f472b6', weekly: [0,0,0,0,0,0,0] }
    ];

    function initApp() {
        const saved = localStorage.getItem('vitality_data_v2');
        if(saved) {
            const data = JSON.parse(saved);
            nutrients.forEach(n => {
                const sn = data.nutrients.find(x => x.key === n.key);
                if(sn) { n.cur = sn.cur; n.weekly = sn.weekly; }
            });
            history = data.history || [];
            userXP = data.xp || 0;
            weightMult = data.weightMult || 1.0;
            activityMult = data.actMult || 1.2;
            document.getElementById('bio-weight').value = (weightMult * 70).toFixed(0);
            document.getElementById('bio-act').value = activityMult;
        }
        updateGreeting();
        updateXPDisplay();
        render();
    }

    function saveToLocal() {
        const data = { nutrients, history, xp: userXP, weightMult, actMult: activityMult };
        localStorage.setItem('vitality_data_v2', JSON.stringify(data));
        updateXPDisplay();
    }

    function render() {
        const list = document.getElementById('nutrient-list');
        const dayIdx = new Date().getDay();
        
        list.innerHTML = nutrients.map(n => {
            const finalNorm = n.norm * weightMult * activityMult;
            const p = Math.round((n.cur/finalNorm)*100);
            const pDisplay = Math.min(100, p);
            let barColor = n.color;
            let barClass = "";
            if (p > 100) { barColor = 'var(--overdose)'; barClass = "overdose-anim"; }
            else if (p > 80) { barColor = 'var(--success)'; }

            return `
            <div class="n-card">
                <div class="n-info">
                    <div><span style="font-weight:800">${n.emoji} ${n.id}</span></div>
                    <div class="controls">
                        <button class="btn-inc" onclick="adjustValue('${n.key}', -5)">-</button>
                        <span style="color:${barColor}; font-weight:900;">${p}%</span>
                        <button class="btn-inc" onclick="adjustValue('${n.key}', 5)">+</button>
                    </div>
                </div>
                <div class="p-bar-bg">
                    <div class="p-bar-fill ${barClass}" style="width:${pDisplay}%; background:${barColor}"></div>
                </div>
                <div class="week-chart">
                    ${n.weekly.map((v, i) => `<div class="day-column"><div class="day-bar" style="height:${Math.min(100, (v/finalNorm)*100)}%; background:${n.color}; opacity:${i===dayIdx?1:0.3}"></div></div>`).join('')}
                </div>
            </div>`;
        }).join('');

        const hList = document.getElementById('history-list');
        hList.innerHTML = history.slice(0, 5).map(h => `<div class="history-item"><b>${h.name}</b><small>${h.time}</small></div>`).join('') || '<p style="text-align:center; color:var(--text-dim)">История пуста</p>';
    }

    function adjustValue(key, delta, silent = false) {
        const n = nutrients.find(i => i.key === key);
        if(!n) return;
        n.cur = parseFloat((Math.max(0, n.cur + delta)).toFixed(1));
        n.weekly[new Date().getDay()] = n.cur;
        if (delta > 0) userXP += 2;
        if(!silent) { saveToLocal(); render(); }
    }

    function addFromCatalog(i) {
        const product = products[i];
        // 1. Применяем все нутриенты продукта
        Object.entries(product.nutrients).forEach(([k, v]) => {
            adjustValue(k, v, true); 
        });
        // 2. Добавляем в историю
        history.unshift({ name: product.name, time: new Date().toLocaleTimeString() });
        // 3. Начисляем XP
        userXP += 20; 
        // 4. Закрываем и обновляем всё
        closeModal('catalog-panel'); 
        saveToLocal(); 
        render();
        confetti({ particleCount: 70, spread: 70, origin: { y: 0.8 } });
    }

    function smartAnalyze() {
        const input = document.getElementById('smart-input').value.toLowerCase();
        if(!input) return;
        let found = false;
        products.forEach(p => {
            if(input.includes(p.name.toLowerCase().substring(0,4))) {
                Object.entries(p.nutrients).forEach(([k, v]) => adjustValue(k, v, true));
                found = true;
            }
        });
        if(found) { confetti({ particleCount: 100 }); history.unshift({ name: "Анализ: " + input, time: new Date().toLocaleTimeString() }); userXP += 30; }
        document.getElementById('smart-input').value = "";
        saveToLocal(); render();
    }

    function updateXPDisplay() {
        document.getElementById('xp-display').innerText = `XP: ${userXP}`;
        const progress = (userXP % 1000) / 10;
        document.getElementById('level-progress').style.width = progress + "%";
    }

    function syncAndReset() {
        history.unshift({ name: "Синхронизация", time: new Date().toLocaleTimeString() });
        nutrients.forEach(n => n.cur = 0);
        userXP += 100; confetti(); saveToLocal(); render();
    }

    function openModal(id) { 
        document.getElementById(id).style.display = 'flex';
        if(id === 'catalog-panel') {
            const container = document.getElementById('product-list-container');
            container.innerHTML = products.map((p, i) => `
                <div class="product-item" onclick="addFromCatalog(${i})">
                    <b>${p.icon} ${p.name}</b>
                    <span style="color:var(--success); font-weight:bold;">+ ДОБАВИТЬ</span>
                </div>`).join('');
        }
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function toggleTheme() { document.body.classList.toggle('light-theme'); }
    function updateGreeting() {
        const hr = new Date().getHours();
        document.getElementById('dynamic-greet').innerText = hr < 12 ? "Доброе утро," : hr < 18 ? "Добрый день," : "Добрый вечер,";
    }
    function clearAllData() { if(confirm("Сбросить?")) { localStorage.clear(); location.reload(); } }
    function toggleLanguage() {
        currentLang = currentLang === 'RU' ? 'EN' : 'RU';
        document.getElementById('lang-btn').innerText = currentLang === 'RU' ? 'EN' : 'RU';
    }
    function updateBio() {
        const w = document.getElementById('bio-weight').value;
        activityMult = parseFloat(document.getElementById('bio-act').value);
        weightMult = w / 70; saveToLocal(); render();
    }
    function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Vitality OS Report", 10, 10);
        nutrients.forEach((n, i) => doc.text(`${n.id}: ${n.cur}`, 10, 20 + (i * 10)));
        doc.save("report.pdf");
    }
    function getAISuggestion() {
        const adviceBox = document.getElementById('ai-advice-box');
        const lowNutrients = nutrients.filter(n => (n.cur / (n.norm * weightMult * activityMult)) < 0.5);
        let text = lowNutrients.length === 0 ? "✨ Отличные показатели!" : `💡 **Совет:** Подтяните ${lowNutrients[0].id}.`;
        adviceBox.innerHTML = text;
        adviceBox.style.display = 'block';
    }
</script>
</body>
</html>
