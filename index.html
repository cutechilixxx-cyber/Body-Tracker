<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vitality OS | Ultra</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    
    <style>
        :root {
            --bg: #0b1120; --card-bg: #1e293b; --accent: #38bdf8; --text: #f8fafc;
            --text-dim: #94a3b8; --border: #334155; --input-bg: #0f172a; --success: #10b981; --danger: #ef4444;
        }
        .light-theme {
            --bg: #f1f5f9; --card-bg: #ffffff; --accent: #0ea5e9; --text: #0f172a;
            --text-dim: #64748b; --border: #e2e8f0; --input-bg: #f8fafc;
        }
        * { box-sizing: border-box; transition: all 0.2s ease; font-family: -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }

        #main-app { width: 100%; max-width: 480px; padding: 20px; padding-top: 40px; padding-bottom: 120px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn-tool { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.8rem; }
        .btn-del { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); }

        .streak-badge {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 14px; padding: 8px 15px; margin-top: 10px; width: 100%;
        }

        .glass-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 32px; padding: 25px; margin-bottom: 25px; position: relative;}
        textarea { width: 100%; padding: 16px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 18px; outline: none; margin-top: 15px; resize: none; }
        .btn-main { background: var(--accent); color: #fff; border: none; padding: 16px; border-radius: 18px; font-weight: 900; cursor: pointer; width: 100%; margin-top: 15px; }

        .n-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 28px; padding: 20px; margin-bottom: 15px; }
        .n-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .controls { display: flex; align-items: center; gap: 10px; }
        .btn-inc { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        .p-bar-bg { height: 10px; background: var(--input-bg); border-radius: 20px; overflow: hidden; margin-bottom: 10px; }
        .p-bar-fill { height: 100%; border-radius: 20px; transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        .week-chart { display: flex; justify-content: space-between; align-items: flex-end; height: 35px; margin-top: 10px; padding-top: 5px; border-top: 1px solid var(--border); }
        .day-column { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .day-bar { width: 8px; border-radius: 2px; min-height: 2px; transition: height 1s ease; }
        .day-label { font-size: 0.55rem; color: var(--text-dim); margin-top: 4px; font-weight: 700; }

        .history-item { display: flex; flex-direction: column; background: var(--card-bg); padding: 15px 20px; border-radius: 22px; margin-bottom: 10px; border: 1px solid var(--border); }
        .save-container { position: fixed; bottom: 25px; left: 0; right: 0; display: flex; justify-content: center; z-index: 100; gap: 10px; }
        .btn-save { background: var(--success); color: white; padding: 16px 30px; border-radius: 50px; font-weight: 900; border: none; cursor: pointer; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; display: none; align-items: flex-end; backdrop-filter: blur(5px); }
        .modal-content { width: 100%; max-width: 480px; background: var(--bg); border-radius: 32px 32px 0 0; padding: 30px; margin: 0 auto; max-height: 90vh; overflow-y: auto; border-top: 2px solid var(--accent); }
        
        .product-item { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 16px; border-radius: 20px; margin-bottom: 12px; border: 1px solid var(--border); cursor: pointer;}
        .bio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .bio-input { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 12px; width: 100%; outline: none; }
        
        .scan-btn { position: absolute; right: 15px; top: 15px; background: none; border: none; font-size: 1.2rem; cursor: pointer; opacity: 0.6; }
        #ocr-status { font-size: 0.7rem; color: var(--accent); margin-top: 5px; text-align: center; }

        /* Эффект уровня (XP Bar) */
        .level-container { width: 100%; height: 4px; background: var(--border); border-radius: 2px; margin-top: 5px; overflow: hidden; }
        #level-progress { height: 100%; background: var(--success); width: 0%; }
    </style>
</head>
<body onload="initApp()">

    <div id="bio-modal" class="modal-overlay" onclick="closeModal('bio-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 style="margin:0 0 10px 0;">🧬 БИО-ПРОФИЛЬ</h2>
            <p style="color:var(--text-dim); font-size: 0.85rem;">Настройте персональные нормы</p>
            <div class="bio-grid">
                <div><label style="font-size:0.7rem;">ВЕС (КГ)</label><input type="number" id="bio-weight" class="bio-input" placeholder="70" onchange="updateBio()"></div>
                <div><label style="font-size:0.7rem;">АКТИВНОСТЬ</label>
                    <select id="bio-act" class="bio-input" onchange="updateBio()">
                        <option value="1">Низкая</option>
                        <option value="1.2" selected>Средняя</option>
                        <option value="1.5">Высокая</option>
                    </select>
                </div>
            </div>
            <button class="btn-main" onclick="closeModal('bio-modal')">ПРИМЕНИТЬ</button>
        </div>
    </div>

    <div id="catalog-panel" class="modal-overlay" onclick="closeModal('catalog-panel')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h2 style="margin:0;">🍽️ КАТАЛОГ</h2>
                <button class="btn-tool" onclick="closeModal('catalog-panel')">ЗАКРЫТЬ</button>
            </div>
            <div id="product-list-container"></div>
        </div>
    </div>

    <div id="main-app">
        <div class="header">
            <div onclick="openModal('bio-modal')" style="cursor:pointer">
                <span id="dynamic-greet" style="color:var(--text-dim); font-size: 0.8rem;">Доброе утро,</span>
                <h2 style="margin:0;">Vitality User! 🧬</h2>
                <div class="streak-badge">
                    <span id="streak-text">🔥 3 ДНЯ СЕРИЯ</span>
                    <div style="text-align:right">
                        <span class="xp-text" id="xp-display">XP: 0</span>
                        <div class="level-container"><div id="level-progress"></div></div>
                    </div>
                </div>
            </div>
            <div style="display:flex; gap:6px;">
                <button class="btn-tool" onclick="toggleTheme()">☀️</button>
                <button class="btn-tool" onclick="exportPDF()">📄 PDF</button>
                <button class="btn-tool btn-del" onclick="clearAllData()">🗑️</button>
            </div>
        </div>

        <div class="glass-panel">
            <button class="scan-btn" onclick="triggerOCR()" title="Сканировать состав">📷</button>
            <textarea id="smart-input" placeholder="AI Анализ: Курица, Яйца или жми 📷" rows="2"></textarea>
            <div id="ocr-status"></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="btn-main" onclick="smartAnalyze()">АНАЛИЗ</button>
                <button class="btn-main" onclick="openModal('catalog-panel')" style="background: var(--card-bg); border: 1px solid var(--accent); color: var(--accent);">+ КАТАЛОГ</button>
            </div>
            <input type="file" id="ocr-upload" hidden accept="image/*" onchange="processOCR(event)">
        </div>

        <div id="nutrient-list"></div>

        <div style="margin-top: 30px;">
            <h3 style="color: var(--text-dim); font-size: 0.9rem; margin-bottom: 15px;">АКТИВНОСТЬ</h3>
            <div id="history-list"></div>
        </div>

        <div class="save-container">
            <button class="btn-save" onclick="syncAndReset()">💾 СИНХРОНИЗАЦИЯ</button>
        </div>
    </div>

<script>
    let currentLang = 'RU';
    let history = [];
    let userXP = 0;
    let weightMult = 1.0;
    let activityMult = 1.2;
    
    const products = [
        { name: "Яйцо", icon: "🥚", nutrients: { vitD3: 40, vitB12: 0.5, vitA: 80, calcium: 30 } },
        { name: "Лосось (100г)", icon: "🐟", nutrients: { omega: 1500, vitD3: 400, vitB12: 4, potassium: 350 } },
        { name: "Шпинат (100г)", icon: "🌿", nutrients: { iron: 2.7, vitA: 450, mag: 80, vitC: 28 } },
        { name: "Миндаль (30г)", icon: "🥜", nutrients: { vitE: 7, mag: 80, calcium: 75, zinc: 1 } },
        { name: "Говядина (100г)", icon: "🥩", nutrients: { iron: 3, zinc: 5, vitB12: 2.5, potassium: 300 } }
    ];

    let nutrients = [
        { key: 'iron', id: 'Железо', emoji: '🥩', cur: 0, norm: 18, color: '#f87171', weekly: [0,0,0,0,0,0,0] },
        { key: 'mag', id: 'Магний', emoji: '🌿', cur: 0, norm: 400, color: '#34d399', weekly: [0,0,0,0,0,0,0] },
        { key: 'vitC', id: 'Витамин C', emoji: '🍊', cur: 0, norm: 90, color: '#38bdf8', weekly: [0,0,0,0,0,0,0] },
        { key: 'vitB12', id: 'Витамин B12', emoji: '🧬', cur: 0, norm: 2.4, color: '#a78bfa', weekly: [0,0,0,0,0,0,0] },
        { key: 'vitD3', id: 'Витамин D3', emoji: '☀️', cur: 0, norm: 600, color: '#fbbf24', weekly: [0,0,0,0,0,0,0] },
        { key: 'zinc', id: 'Цинк', emoji: '🐚', cur: 0, norm: 11, color: '#94a3b8', weekly: [0,0,0,0,0,0,0] },
        { key: 'calcium', id: 'Кальций', emoji: '🥛', cur: 0, norm: 1000, color: '#e2e8f0', weekly: [0,0,0,0,0,0,0] },
        { key: 'omega', id: 'Омега-3', emoji: '🐟', cur: 0, norm: 1000, color: '#f472b6', weekly: [0,0,0,0,0,0,0] }
    ];

    function initApp() {
        const saved = localStorage.getItem('vitality_data_v2');
        if(saved) {
            const data = JSON.parse(saved);
            nutrients.forEach(n => {
                const sn = data.nutrients.find(x => x.key === n.key);
                if(sn) { n.cur = sn.cur; n.weekly = sn.weekly; }
            });
            history = data.history || [];
            userXP = data.xp || 0;
            weightMult = data.weightMult || 1.0;
            activityMult = data.actMult || 1.2;
            document.getElementById('bio-weight').value = (weightMult * 70).toFixed(0);
        }
        updateGreeting();
        updateXPDisplay();
        render();
        requestNotifPermission();
    }

    function saveToLocal() {
        const data = { nutrients, history, xp: userXP, weightMult, actMult: activityMult };
        localStorage.setItem('vitality_data_v2', JSON.stringify(data));
        updateXPDisplay();
    }

    function updateBio() {
        const w = document.getElementById('bio-weight').value;
        activityMult = parseFloat(document.getElementById('bio-act').value);
        weightMult = w / 70; 
        saveToLocal(); render();
    }

    function render() {
        const list = document.getElementById('nutrient-list');
        const dayIdx = new Date().getDay();
        
        list.innerHTML = nutrients.map(n => {
            const finalNorm = n.norm * weightMult * activityMult;
            const p = Math.min(100, Math.round((n.cur/finalNorm)*100));
            return `
            <div class="n-card">
                <div class="n-info">
                    <div><span style="font-weight:800">${n.emoji} ${n.id}</span></div>
                    <div class="controls">
                        <button class="btn-inc" onclick="adjustValue('${n.key}', -5)">-</button>
                        <span class="manual-input" style="color:${n.color}; font-weight:900;" onclick="manualSet('${n.key}')">${p}%</span>
                        <button class="btn-inc" onclick="adjustValue('${n.key}', 5)">+</button>
                    </div>
                </div>
                <div class="p-bar-bg"><div class="p-bar-fill" style="width:${p}%; background:${n.color}"></div></div>
                <div class="week-chart">
                    ${n.weekly.map((v, i) => `<div class="day-column"><div class="day-bar" style="height:${Math.min(100, (v/finalNorm)*100)}%; background:${n.color}; opacity:${i===dayIdx?1:0.3}"></div></div>`).join('')}
                </div>
            </div>`;
        }).join('');

        const hList = document.getElementById('history-list');
        hList.innerHTML = history.slice(0, 5).map(h => `<div class="history-item"><b>${h.name}</b><small>${h.time}</small></div>`).join('') || 'Нет данных';
    }

    function adjustValue(key, delta, silent = false) {
        const n = nutrients.find(i => i.key === key);
        n.cur = parseFloat((Math.max(0, n.cur + delta)).toFixed(1));
        n.weekly[new Date().getDay()] = n.cur;
        if (delta > 0) userXP += 2;
        if(!silent) { saveToLocal(); render(); }
    }

    // --- SMART OCR LOGIC ---
    function triggerOCR() { document.getElementById('ocr-upload').click(); }
    async function processOCR(e) {
        const file = e.target.files[0];
        if(!file) return;
        const status = document.getElementById('ocr-status');
        status.innerText = "🔍 Сканирую состав...";
        
        try {
            const { data: { text } } = await Tesseract.recognize(file, 'rus+eng');
            status.innerText = "✅ Готово! Проверяю нутриенты...";
            // Простейший поиск ключевых слов в тексте
            nutrients.forEach(n => {
                if(text.toLowerCase().includes(n.id.toLowerCase().substring(0, 4))) {
                    adjustValue(n.key, n.norm * 0.2); // Добавляем 20% от нормы если нашли слово
                }
            });
            setTimeout(() => status.innerText = "", 3000);
        } catch (err) { status.innerText = "❌ Ошибка сканирования"; }
    }

    // --- PDF EXPORT ---
    function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Vitality OS Report", 10, 10);
        nutrients.forEach((n, i) => {
            doc.text(`${n.id}: ${n.cur} / ${n.norm}`, 10, 20 + (i * 10));
        });
        doc.save("vitality-report.pdf");
        userXP += 50; saveToLocal();
    }

    // --- SMART NOTIFICATIONS ---
    function requestNotifPermission() {
        if ("Notification" in window) Notification.requestPermission();
    }

    function checkReminders() {
        const hr = new Date().getHours();
        if(hr === 18) { // Вечерняя проверка
            const low = nutrients.filter(n => n.cur < (n.norm * 0.3));
            if(low.length > 0) {
                new Notification("Vitality OS", { body: `Забыли про витамины? ${low[0].id} на критическом уровне!` });
            }
        }
    }
    setInterval(checkReminders, 3600000); // Раз в час

    function updateXPDisplay() {
        document.getElementById('xp-display').innerText = `XP: ${userXP}`;
        const progress = (userXP % 1000) / 10;
        document.getElementById('level-progress').style.width = progress + "%";
    }

    function smartAnalyze() {
        const input = document.getElementById('smart-input').value.toLowerCase();
        let found = false;
        products.forEach(p => {
            if(input.includes(p.name.toLowerCase().substring(0,4))) {
                Object.entries(p.nutrients).forEach(([k, v]) => adjustValue(k, v, true));
                found = true;
            }
        });
        if(found) {
            confetti({ particleCount: 100 });
            history.unshift({ name: input, time: new Date().toLocaleTimeString() });
            userXP += 30;
        }
        document.getElementById('smart-input').value = "";
        saveToLocal(); render();
    }

    function syncAndReset() {
        history.unshift({ name: "Daily Sync", time: new Date().toLocaleTimeString() });
        nutrients.forEach(n => n.cur = 0);
        userXP += 100;
        confetti(); saveToLocal(); render();
    }

    function openModal(id) { 
        document.getElementById(id).style.display = 'flex';
        if(id === 'catalog-panel') {
            const container = document.getElementById('product-list-container');
            container.innerHTML = products.map((p, i) => `
                <div class="product-item" onclick="addFromCatalog(${i})">
                    <b>${p.icon} ${p.name}</b>
                    <span style="color:var(--success)">+ ADD</span>
                </div>`).join('');
        }
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function addFromCatalog(i) {
        Object.entries(products[i].nutrients).forEach(([k, v]) => adjustValue(k, v, true));
        userXP += 20; closeModal('catalog-panel'); saveToLocal(); render();
    }
    function toggleTheme() { document.body.classList.toggle('light-theme'); }
    function updateGreeting() {
        const hr = new Date().getHours();
        document.getElementById('dynamic-greet').innerText = hr < 12 ? "Доброе утро," : hr < 18 ? "Добрый день," : "Добрый вечер,";
    }
    function clearAllData() { if(confirm("Сбросить прогресс?")) { localStorage.clear(); location.reload(); } }
    function manualSet(key) {
        const n = nutrients.find(i => i.key === key);
        const val = prompt(n.id, n.cur);
        if(val) { n.cur = parseFloat(val); saveToLocal(); render(); }
    }
</script>
</body>
</html>
